<!DOCTYPE html>
<html spellcheck="false" lang="en">
<head>
	<meta charset="UTF-8">

	<title>Test | OKZGN</title>

	<script src="./test/Router.js"></script>
	<script src="./test/Router.start.js"></script>
	<script>
	const app = RouterStart({ async: true });

	app.use((ctx, next) => {
      console.log('Navigation event:', ctx.pathname);
      return next();
	});

	let isLogged = false;
	app.use('/dashboard', (ctx, next) => {
      if (!isLogged) {
        ctx.redirect('/login');
        return;
      }
      return next();
	});

	let viewBox;
	document.addEventListener('DOMContentLoaded', () => {
	  viewBox = document.getElementById('view');
	});

	app.add('/', (ctx) => {
      viewBox.innerHTML = '<h2>Home</h2>';
	});

	app.add('/login', (ctx) => {
      viewBox.innerHTML = '<h2>Login (click Auth)</h2>';
	});

	app.add('/auth', (ctx) => {
	  isLogged = (!isLogged ? true : false);
      viewBox.innerHTML = '<h2>Auth toggle: ' + (isLogged ? 'on' : 'off') + '</h2>';
	});

	app.add('/dashboard', (ctx) => {
      viewBox.innerHTML = '<h2>Dashboard</h2>';
	});

	const lastSlash = (window.location.pathname.lastIndexOf('/') + 1);
	const currentPathDirname = (lastSlash ? window.location.pathname.substring(0, lastSlash) : window.location.pathname);

	app.listen(currentPathDirname);
	</script>
</head>

<body>
    <h1>Test:</h1>
    <div data-x>
        <p>Router links:</p>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/login">Login</a></li>
            <li><a href="/auth">Auth</a> (toggle)</li>
            <li><a href="/dashboard">Dashboard</a> (Auth click required first)</li>
            <li><a data-router-exclude href="#last-view">Anchor Link</a> ([data-router-exclude])</li>
        </ul>
        <p>Views:</p>
        <div id="view" data-x>
            Start view.
        </div>
    </div>

    <br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br>

    <div id="last-view" data-x>
        Last view.
    </div>
    <style>
    :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;

        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", monospace;
    }
    *, *::before, *::after {
        box-sizing: border-box;
    }
    body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        margin: 0;
        padding: 1rem;
        font: 1rem normal var(--font-sans);
    }

    [data-x] {
        border: 0.125rem solid gray;
        border-radius: 1rem;
        padding: 0.5rem 1rem;
    }
	</style>
</body>
</html>
