<!DOCTYPE html>
<html spellcheck="false" lang="en">
<head>
	<meta charset="UTF-8">

	<title>Test | OKZGN</title>

	<script src="./test/Component.js"></script>
	<script>

	const CA = new Component('CompA', () => {
      console.log('1');
	})
	.load(() => {
      new Component('CompB', () => {
          console.log('2');
          throw new Error('Something went wrong.');
      })
      .fail((e) => {
          console.error('Error description:', e);
      });
	});

	// This example uses async/await (ES2017+) for convenience,
	// but it is not required.
	const CC = new Component('CompC', async () => {
      const req = await fetch('./test/data.json');

      if (!req.ok) {
          throw new Error('Request failed: ' + req.status);
      }

      return await req.text();
	})
	.load((r) => {
      console.info('JSON Request:', r.slice(0, 128), '...');
	})
	.fail((e) => {
      console.warn('CompC failed:', e);
	});


	CA.ok.then((r) => {
      console.info('Result:', r);
	}).catch((e) => {
	  console.error(e);
	});

	CC.ok.then((r) => {
      console.info('Result:', r);
	});


    </script>
</head>

<body>
    <h1>Test:</h1>
    <div data-x>
        <p>Component test.</p
    </div>

    <style>
    :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;

        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", monospace;
    }
    *, *::before, *::after {
        box-sizing: border-box;
    }
    body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        margin: 0;
        padding: 1rem;
        font: 1rem normal var(--font-sans);
    }

    [data-x] {
        border: 0.125rem solid gray;
        border-radius: 1rem;
        padding: 0.5rem 1rem;
    }
	</style>
</body>
</html>
